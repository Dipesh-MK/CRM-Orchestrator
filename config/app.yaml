# CampaignForge Orchestrator Configuration

llm:
  base_url: "http://localhost:11434/v1"
  model: "qwen2.5:7b-instruct"
  api_key_env: "LLM_API_KEY"
  temperature: 0.3
  request_timeout_seconds: 120


orchestrator:
  min_tone_candidates: 3
  word_limit: 320
  max_retries: 3
  max_discovery_rounds: 5
  optout_text: "Reply STOP to unsubscribe."
  personalization_tag_format: "{{{tag}}}"  # Jinja or regex style {{tag}}
  default_workspace_id: "default_workspace"

paths:
  database_path: "data/campaignforge.db"
  logs_dir: "logs"
  prompts_dir: "prompts"
  suppression_file: "data/suppression.json"

memory:
  enabled: true
  max_relevant_entries: 10

channel:
  adapter: "aggregator"
  tool_dir: "generated/aggregator"
  base_url_env: "APITOOL_BASE_URL"
  agent_tool_allowlist: ["propose_dispatch"]

dispatch:
  enabled: true
  require_user_confirm: true
  max_messages_per_run: 50
  allow_non_loopback: false
  allowed_hosts:
    - "127.0.0.1:8000"
    - "localhost:8000"
    - "127.0.0.1"
    - "localhost"
    - "::1"
    - "[::1]:8000"
    - "testserver"
    - "test"
  allowed_origins:
    - "http://localhost:8000"
    - "http://127.0.0.1:8000"
    - "http://[::1]:8000"
    - "http://testserver"
    - "http://test"
  approval_ttl_seconds: 900
  registry_cache_ttl_seconds: 300
  require_registered_phone: true
  send_interval_ms: 50
  status_callback_url: null

external_evaluator:
  version: "1.0.0"
  enabled: true
  scam_phrases_file: "config/scam_phrases.json"
  url_shorteners:
    - "bit.ly"
    - "tinyurl.com"
    - "t.co"
    - "goo.gl"
    - "ow.ly"
    - "is.gd"
    - "buff.ly"
    - "adf.ly"
    - "bit.do"
    - "rb.gy"
    - "cutt.ly"
  stage2:
    model_name: "SCAMBERT-distilbert"
    model_version: "scambert-v1.2"
    safe_threshold: 0.95
    harmful_threshold: 0.90
  stage3:
    judge_model_version: "qwen2.5:7b-instruct-judge"
    temperature: 0.0
    timeout_seconds: 30
  retry_caps:
    format: 3
    harmful_intent: 2
